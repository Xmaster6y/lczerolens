[project]
name = "lczerolens"
version = "0.5.1"
description = "lc0 interoperability and chess-decision evidence in PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yoann Poupart", email = "yoann.poupart@ens-lyon.org"},
]
requires-python = ">=3.11"
dependencies = [
    "onnx2torch>=1.5.15",
    "python-chess>=1.999",
    "tensordict>=0.9.1",
    "torch>=2.5.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
homepage = "https://lczerolens.readthedocs.io/"
documentation = "https://lczerolens.readthedocs.io/"
source = "https://github.com/Xmaster6y/lczerolens"
issues = "https://github.com/Xmaster6y/lczerolens/issues"
releasenotes = "https://github.com/Xmaster6y/lczerolens/releases"

[project.optional-dependencies]
hub = [
    "huggingface-hub>=0.27.1",
]

[dependency-groups]
dev = [
    "gdown>=5.2.0",
    "ipykernel>=6.29.5",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]
conformance = [
    "v-lczero-bindings>=0.31.2",
]
docs = [
    "ipykernel>=6.29.5",
    "nbsphinx>=0.9.7",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.6.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-llm>=0.3.0",
    "sphinxcontrib-bibtex>=2.6.5",
]

[build]
target-dir = "build/dist"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
markers = [
    "unit: deterministic tests of library code with no external service or model fixture (automatic default)",
    "conformance: lc0 compatibility checks that require versioned model fixtures (explicit primary tier)",
    "integration: tests that exercise another process boundary (explicit primary tier)",
    "network: tests that contact an external service and are never in the offline suite (explicit primary tier)",
    "slow: tests intended for the explicitly requested slow tier (explicit primary tier)",
]

[tool.ruff]
line-length = 119
target-version = "py311"
