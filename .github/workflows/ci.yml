on:
  workflow_call:
    inputs:
      tests-type:
        required: true
        type: string

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install just
      uses: extractions/setup-just@v3
      with:
        just-version: 1.41.0
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync --locked --group dev --extra hub --extra datasets --extra viz --extra backends
    - name: Run checks
      run: |
        just checks
    - name: Download assets
      run: |
        just tests-assets
    - name: Run tests
      run: |
        just ${{ inputs.tests-type }}
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload test results to Codecov
      if: matrix.python-version == '3.10' && ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  installation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: base
            sync-args: --no-default-groups
            import: import lczerolens
          - name: hub
            sync-args: --no-default-groups --extra hub
            import: import lczerolens, huggingface_hub
          - name: datasets
            sync-args: --no-default-groups --extra datasets
            import: import lczerolens, datasets, sklearn
          - name: viz
            sync-args: --no-default-groups --extra viz
            import: import lczerolens, graphviz, matplotlib
          - name: backends
            sync-args: --no-default-groups --extra backends
            import: import lczerolens; from lczero.backends import Backend
          - name: docs
            sync-args: --no-default-groups --group docs
            import: import lczerolens, sphinx
    name: Installation (${{ matrix.name }})
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.11"
    - name: Install selected package dependencies
      run: uv sync --locked ${{ matrix.sync-args }}
    - name: Check imports
      run: uv run --no-sync python -c "${{ matrix.import }}"
